<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current</title><link rel="stylesheet" href="css/current.css"></head>
<body>
<main id="current">
  <header><strong>Current<span class="spark">↝</span></strong><span id="host-label">Curve editor</span><button id="compact" class="icon" title="Toggle compact view" aria-label="Toggle compact view">▥</button></header>
  <div class="mode-row" role="tablist" aria-label="Curve mode"><button data-mode="bezier" role="tab">Bezier</button><button data-mode="standard" role="tab">Ease</button><button data-mode="spring" role="tab">Spring</button><button data-mode="elastic" role="tab">Elastic</button><button data-mode="bounce" role="tab">Bounce</button></div>
  <div id="graph-wrap"><svg id="graph" preserveAspectRatio="none" viewBox="0 0 300 180" role="img" aria-label="Easing curve editor" tabindex="0"><defs><pattern id="grid" width="26" height="23.5" patternUnits="userSpaceOnUse" x="20" y="16"><path d="M26 0H0V23.5" class="grid-line"/></pattern></defs><rect x="20" y="16" width="260" height="141" fill="url(#grid)"/><path id="baseline" class="baseline"/><path id="handles" class="handle-line"/><path id="curve" class="curve"/><circle id="start" r="3" class="endpoint"/><circle id="end" r="3" class="endpoint"/><circle id="h0" r="6" class="handle" data-handle="0"/><circle id="h2" r="6" class="handle" data-handle="2"/><circle id="hit0" r="15" class="handle-hit" data-handle="0"/><circle id="hit2" r="15" class="handle-hit" data-handle="2"/></svg><span id="curve-label">cubic-bezier</span></div>
  <div id="bezier-controls" class="controls"><label>X1<input id="x1" type="number" min="0" max="1" step="0.01"></label><label>Y1<input id="y1" type="number" min="-9" max="10" step="0.01"></label><label>X2<input id="x2" type="number" min="0" max="1" step="0.01"></label><label>Y2<input id="y2" type="number" min="-9" max="10" step="0.01"></label><button id="reverse" title="Reverse easing">⇄</button></div>
  <div id="standard-controls" class="controls" hidden><select id="family" aria-label="Easing family"><option value="ease">Ease</option><option value="linear">Linear</option><option value="quad">Quad</option><option value="cubic">Cubic</option><option value="quart">Quart</option><option value="quint">Quint</option><option value="sine">Sine</option><option value="expo">Expo</option><option value="circ">Circ</option><option value="back">Back</option></select><select id="direction" aria-label="Direction"><option value="in">In</option><option value="out">Out</option><option value="inout">In / Out</option></select></div>
  <div id="physics-controls" class="controls" hidden><label>Frequency<input id="frequency" type="number" min="0.5" max="12" step="0.1"></label><label>Damping<input id="damping" type="number" min="0.1" max="20" step="0.1"></label><label>Amplitude<input id="amplitude" type="number" min="0" max="3" step="0.1"></label></div>
  <div class="apply-row"><button id="preview" title="Preview motion without changing keyframes">▶</button><div id="preview-track" aria-hidden="true"><span id="preview-dot"></span></div><label id="density-label" hidden>Samples<input id="density" type="number" min="1" max="8" step="1"></label><button id="apply" class="primary">Apply to keys</button></div>
  <section id="library" aria-label="Graph libraries"><nav id="tabs" aria-label="Graph lists"></nav><div class="library-tools"><input id="search" type="search" placeholder="Find a curve…" aria-label="Find a curve"><button id="import">Import</button><select id="export-format" aria-label="Export format"><option value="current">.current</option><option value="flow">.flow</option></select><button id="export">Export</button><input id="import-file" type="file" accept=".current,.flow,.json" hidden></div><div id="cards" role="list"></div><div class="save-row"><input id="graph-name" maxlength="80" placeholder="Curve name" aria-label="Curve name"><button id="save">Save</button><button id="delete-graph" class="icon" title="Delete saved graph" aria-label="Delete saved graph">−</button></div><div class="list-tools"><input id="list-name" maxlength="80" placeholder="New list name" aria-label="List name"><button id="new-list">+ List</button><button id="rename-list">Rename</button><button id="delete-list" class="icon" title="Delete list" aria-label="Delete list">−</button></div></section>
  <p id="status" role="status" aria-live="polite">Select adjacent numeric keyframes, then apply a curve.</p>
</main><script src="js/current-core.js"></script><script src="js/panel.js"></script></body></html>
